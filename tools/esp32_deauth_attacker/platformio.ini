; Bounded forged-deauth source for validating the RF identity detector against
; OUR OWN access points only (docs/WIFI_RF_IDENTITY_2026-11-04.md). Idle at
; boot; manual arming; capped, low-power bursts. Not for any third-party network.
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -Wl,--allow-multiple-definition

; Bounded evil-twin beacon source for validating rf_identity_two_transmitters
; (docs/WIFI_RF_IDENTITY_2026-11-04.md). Clones the BSSID of an access point we
; own, via a real low-power softAP, so the X310 sees two carrier offsets under
; one BSSID. Idle at boot; manual start. For our own equipment only.
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

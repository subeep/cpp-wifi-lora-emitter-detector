; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) test transmitter for the LoRa
; tab's live over-the-air validation. Build/flash:
;   pio run -d tools/heltec_lora_telemetry -t upload --upload-port /dev/ttyUSB0
[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.1.2
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
